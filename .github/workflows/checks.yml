name: Agent checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Compare complete MCP snapshots
        uses: L1Huash1/mcp-changecheck@v0.3.0
        with:
          before: contracts/baseline.json
          after: contracts/candidate.json
          report-path: reports/contracts.md
  local-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python demo.py trace.jsonl
      - name: Enforce local tool-call budgets
        run: agent-tracecheck trace.jsonl --max-calls 4 --max-errors 0 --format markdown --output trace-report.md
      - name: Show trace diagnostics in the job summary
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          report = Path('trace-report.md')
          if report.is_file():
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(report.read_text(encoding='utf-8') + '\n')
